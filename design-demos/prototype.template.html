<!doctype html>
<!-- 假设：首页保留画区、时长和开始；异常参数折叠。图片和游戏状态为交互演示。 -->
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安全边界 · __TITLE__</title>
<style>
@font-face{font-family:Material;src:url('__FONT__')}*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#202122;color:#f4f4f4;font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;color:inherit;background:#242627;border:1px solid #444748;border-radius:6px;min-height:44px;padding:0 14px}button:hover{filter:brightness(1.16)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent,#78dfbd);outline-offset:3px}button:disabled{opacity:.4;cursor:default}a{color:inherit;text-decoration:none}.intro{max-width:1536px;margin:auto;padding:28px 28px 22px}.intro h1{font-size:24px;margin:6px 0}.intro p{margin:4px 0;color:#b4b7b7}.eyebrow{font-size:12px;color:#b4b7b7}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;max-width:1536px;padding:0 28px 32px;margin:auto}.label{margin:0 0 10px;color:#bfc2c2;font-size:13px}.app{--accent:#efefec;--on-accent:#101111;position:relative;background:#101112;height:740px;min-width:0;display:flex;flex-direction:column;overflow:hidden}.app.b{--accent:#71e1bb;--on-accent:#08271c;background:#111615}.app.c{--accent:#f0d773;--on-accent:#292207;background:#18191a}.header{height:72px;flex-shrink:0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #323435}.header strong{font-size:20px}.icon{font-family:Material;font-size:23px;font-weight:normal;line-height:1;display:inline-block;font-style:normal;vertical-align:middle}.icon-button{padding:0;width:44px;flex:0 0 44px;background:transparent;border:0}.stage{position:relative;min-height:0;background:#090b0b;flex:1;isolation:isolate}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.region{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.status{position:absolute;left:16px;top:16px;font-size:12px;background:#101614;color:#91edbf;padding:6px 10px;border:1px solid #48554b}.status.warn{color:#ffc0bd;background:#2c1717;border-color:#78504d}.camera-switch{position:absolute;right:10px;bottom:10px;background:#111a17;border:1px solid #4e5954;border-radius:50%}.tools{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #343637;gap:12px}.segments{display:flex;border:1px solid #4a4c4d;border-radius:6px;overflow:hidden;min-width:0}.segments button{border:0;border-radius:0;min-width:52px;padding:0 15px;background:transparent}.segments .selected{background:var(--accent);color:var(--on-accent)}.settings{padding:18px 20px 10px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#b0b6b4}.duration{display:flex;gap:8px;margin-top:12px}.duration button{flex:1;padding:0 8px;white-space:nowrap}.duration .selected{border-color:var(--accent);color:var(--accent);background:#292d2c}.more{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:transparent;padding:0;margin-top:8px;color:#b9bdbb}.footer{padding:14px 20px 20px;margin-top:auto}.primary{width:100%;background:var(--accent);color:var(--on-accent);border:0;font-weight:650;height:52px}.primary .icon{margin-right:8px}.b .header{position:absolute;z-index:2;left:0;right:0;background:#111615;border:0;height:60px}.b .stage{margin-top:60px}.b .tools{position:absolute;z-index:2;top:114px;left:8px;padding:0;border:0;flex-direction:column;gap:8px}.b .tools .segments{flex-direction:column;background:#101a16}.b .tools .segments button{min-width:44px;padding:0}.b .tools>button{background:#101a16}.b .status{left:16px;top:12px}.b .settings{padding-top:16px;border-top:1px solid #3e4944}.b .duration{margin-top:14px}.b .duration button{border:0;border-bottom:2px solid #46534d;border-radius:0;background:transparent}.b .duration button.selected{border-color:var(--accent)}.c .header{height:62px}.c .settings{order:1;padding-top:14px;padding-bottom:10px;border-bottom:1px solid #444647}.c .stage{order:2}.c .tools{order:3}.c .footer{order:4}.c .duration{display:none}.c .time-pick{font-size:32px;font-family:Consolas,monospace;min-width:136px;height:52px;color:var(--accent);background:transparent;border:0;text-align:right;padding-right:0}.c .more{font-size:13px}.c .status{top:12px;left:12px}.c .footer .primary{border-radius:2px}.c .segments{border-radius:2px}.c .tools{padding-top:10px;padding-bottom:10px}.timer-bar{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #343737}.timer{font:36px/1.2 Consolas,monospace;font-variant-numeric:tabular-nums}.stat{text-align:right}.stat strong{display:block;font:24px/1.4 Consolas,monospace}.live .stage{order:initial}.live .footer{order:initial}.live .header{position:static}.live.b .stage{margin-top:0}.abnormal{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:#f7b6b1;background:#301d1e;border-top:1px solid #65383b}.abnormal strong{font:25px Consolas,monospace}.actions{display:flex;gap:12px}.actions .primary{flex:1}.actions>.secondary{min-width:88px}.sheet-back{position:absolute;inset:0;background:#0008;z-index:5;display:flex;align-items:flex-end}.sheet{width:100%;padding:22px 20px 24px;background:#202324;border-top:1px solid #535858;max-height:100%;overflow:auto}.sheet h2{font-size:20px;margin:0}.sheet .row{padding:18px 0;border-bottom:1px solid #464b49}.sheet details{padding:10px 0 20px}.sheet summary{padding:14px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}.sheet label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}.sheet input,.sheet select{color:#fff;background:#121515;border:1px solid #676d6b;border-radius:4px;padding:10px;width:94px;min-height:44px}.sheet input:invalid{border-color:#f19e98}.sheet .error{color:#ffb4ac;min-height:21px;margin:0 0 12px}.result{padding:28px 20px;flex:1}.result .complete-icon{width:48px;height:48px;background:#263831;color:#94e6bd;display:grid;place-items:center;border-radius:50%;margin-bottom:16px}.result h2{font-size:24px;margin:0 0 28px}.result .totals{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:28px;border-bottom:1px solid #484b49}.result .totals strong{display:block;font:30px/1.6 Consolas,monospace}.result h3{font-size:14px;margin-top:24px}.empty{padding:26px 0;color:#aeb5b1}.event{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #383d3b}.mode-switch{padding:14px 0;color:#bdc1bf;display:flex;gap:12px;align-items:center}.mode-switch select{padding:6px;font:inherit;background:#282c2a;color:#eee;border:1px solid #656e68;max-width:100%}.pause-tag{position:absolute;inset:0;background:#050a07b8;display:grid;place-content:center;text-align:center;font-size:24px}.pause-tag small{font-size:14px;color:#b8c5bc;margin-top:10px}.single .intro,.single .label,.single .mode-switch{display:none}.single .gallery{display:block;padding:0;max-width:440px}.single .panel:not(:first-child){display:none}.single .app{height:100dvh;min-height:620px}.single{background:#101112}.review-link{border-bottom:1px solid #6e7470}.camera-name{font-size:12px;color:#adb8b2}.app button[aria-label]{position:relative}.stage button{position:absolute}.custom-time{width:100%}@media(max-width:1150px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));max-width:840px}}@media(max-width:560px){.gallery{grid-template-columns:minmax(0,1fr);padding:0 16px 24px;max-width:420px}.intro{padding:20px 16px}.app{height:740px}.intro h1{font-size:22px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
.app .stage>.icon-button{position:absolute;right:12px;bottom:12px;background:#111a17;border:1px solid #64726a;border-radius:50%}.result{overflow:auto}.status{pointer-events:none}
</style>
<body>
<header class="intro"><a class="eyebrow review-link" href="index.html">返回三版对比</a><h1>__TITLE__</h1><p>__DESCRIPTION__</p><p>可点击原型 · 取景画面为示例图片，游戏状态为模拟。</p></header>
<main class="gallery" id="gallery"></main>
<script>
const variant='__VARIANT__';
const image='__IMAGE__';
const icons={switch:0xe137,gesture:0xe2d4,rectangle:0xe1ae,clear:0xe1bb,play:0xe4cb,pause:0xe47c,stop:0xe606,close:0xe16a,expand:0xe246,check:0xe156,replay:0xe523,tune:0xe683};
const icon=n=>`<i class="icon" aria-hidden="true">&#${icons[n]};</i>`;
const ib=(name,label,action)=>`<button class="icon-button" title="${label}" aria-label="${label}" data-action="${action}">${icon(name)}</button>`;
const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
if(new URLSearchParams(location.search).has('single'))document.body.classList.add('single');
function mount(initial,index){
 const panel=document.createElement('section');panel.className='panel';panel.innerHTML=`<p class="label">${['01 / 准备','02 / 设置','03 / 游戏','04 / 结果'][index]}</p><div class="app ${variant}"></div><label class="mode-switch">演示状态<select aria-label="演示人体状态"><option value="inside">区域内</option><option value="outside">越界</option><option value="absent">无人</option><option value="incomplete">跟踪不完整</option></select></label>`;document.querySelector('#gallery').append(panel);
 const app=panel.querySelector('.app');
 let state=initial==='settings'?'ready':initial,modal=initial==='settings',minutes=5,delay=3,repeat=3,elapsed=0,events=[],mode='rectangle',camera='后置',condition='inside',abnormalAt=null,lastEmit=null,points=[[.08,.10],[.92,.10],[.92,.92],[.08,.92]],drawing=false,anchor=null;
 const regionReady=()=>points.length>=3;
 const stage=()=>`<div class="stage"><img class="photo" src="${image}" alt="人体姿态识别示例"><canvas class="region" aria-label="活动区域画布"></canvas><span class="status ${condition==='outside'||condition==='absent'?'warn':''}">${!regionReady()?'待画区':({inside:'人体已就位',outside:'人体越界',absent:'画面中无人',incomplete:'跟踪不完整'})[condition]}</span>${state==='ready'?ib('switch','切换摄像头','camera'):''}${state==='paused'?'<div class="pause-tag">已暂停<small>等待手动继续</small></div>':''}</div>`;
 function render(){
  app.classList.toggle('live',state!=='ready');
  const head=`<div class="header"><strong>${state==='result'?'本局结果':'安全边界'}</strong>${state==='ready'?`<span class="camera-name">${camera}摄像头</span>`:state==='result'?'':`<span class="muted">${state==='paused'?'已暂停':'游戏中'}</span>`}</div>`;
  if(state==='result')app.innerHTML=head+`<div class="result"><div class="complete-icon">${icon('check')}</div><h2>本局已结束</h2><div class="totals"><div><span class="muted">实际时长</span><strong>${fmt(elapsed)}</strong></div><div><span class="muted">模拟触发</span><strong>${events.length}<small style="font:14px sans-serif"> 次</small></strong></div></div><h3>触发记录</h3>${events.length?events.map((e,i)=>`<div class="event"><span>${String(i+1).padStart(2,'0')} · ${e.reason}</span><span>${fmt(e.time)}</span></div>`).join(''):'<div class="empty">本局暂无触发记录</div>'}</div><div class="footer"><button class="primary" data-action="again">${icon('replay')}再来一局</button></div>`;
  else if(state==='ready')app.innerHTML=head+stage()+`<div class="tools"><div class="segments" aria-label="画区方式"><button title="自由圈画" aria-label="自由圈画" class="${mode==='gesture'?'selected':''}" data-action="gesture">${icon('gesture')}</button><button title="矩形画区" aria-label="矩形画区" class="${mode==='rectangle'?'selected':''}" data-action="rectangle">${icon('rectangle')}</button></div>${ib('clear','重画区域','clear')}</div><div class="settings"><div class="line"><span class="muted">游戏时长</span>${variant==='c'?`<button class="time-pick" data-action="settings">${fmt(minutes*60)}</button>`:`<strong>${minutes} 分钟</strong>`}</div><div class="duration">${[3,5,10].map(n=>`<button data-minutes="${n}" class="${minutes===n?'selected':''}">${n} 分钟</button>`).join('')}<button data-action="settings">自定</button></div><button class="more" data-action="settings"><span>更多设置</span>${icon('expand')}</button></div><div class="footer"><button class="primary" data-action="start" ${!regionReady()||condition!=='inside'?'disabled':''}>${icon('play')}开始游戏</button></div>`;
  else app.innerHTML=head+`<div class="timer-bar"><div><span class="muted">剩余时间</span><div class="timer">${fmt(Math.max(0,minutes*60-elapsed))}</div></div><div class="stat"><span class="muted">模拟触发</span><strong>${events.length}</strong></div></div>`+stage()+`<div class="abnormal" ${abnormalAt===null?'style="visibility:hidden"':''}><span>${condition==='absent'?'画面中无人':'人体越界'} · 触发倒计时</span><strong>${Math.max(0,(lastEmit===null?delay-(elapsed-(abnormalAt??elapsed)):repeat-(elapsed-lastEmit)))}s</strong></div><div class="footer actions"><button class="primary" data-action="pause">${icon(state==='paused'?'play':'pause')}${state==='paused'?'继续游戏':'暂停'}</button><button class="secondary" data-action="end">${icon('stop')} 结束</button></div>`;
  if(modal)app.insertAdjacentHTML('beforeend',`<div class="sheet-back"><form class="sheet"><div class="line"><h2>游戏设置</h2>${ib('close','关闭设置','close')}</div><label class="row">游戏时长 <span><input aria-label="游戏时长" name="minutes" type="number" min="1" max="120" value="${minutes}" required> 分钟</span></label><details><summary>更多设置 ${icon('expand')}</summary><label>异常持续 <span><input aria-label="异常持续" name="delay" type="number" min="1" max="60" value="${delay}" required> 秒</span></label><label>重复间隔 <span><input aria-label="重复间隔" name="repeat" type="number" min="1" max="60" value="${repeat}" required> 秒</span></label></details><p class="error" aria-live="polite"></p><button class="primary" type="submit">保存</button></form></div>`);
  const form=app.querySelector('form');if(form)form.onsubmit=e=>{e.preventDefault();const data=new FormData(form);minutes=Number(data.get('minutes'));delay=Number(data.get('delay'));repeat=Number(data.get('repeat'));modal=false;render()};
  app.querySelectorAll('button[data-action]').forEach(b=>{b.type='button';b.onclick=()=>act(b.dataset.action)});
  app.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>{minutes=Number(b.dataset.minutes);render()});
  requestAnimationFrame(setupCanvas);
 }
 function act(a){
  if(a==='settings')modal=true;if(a==='close')modal=false;
  if(a==='gesture'||a==='rectangle'){mode=a;points=[]}
  if(a==='clear')points=[];
  if(a==='camera'){camera=camera==='后置'?'前置':'后置';points=[]}
  if(a==='start'&&regionReady()&&condition==='inside'){state='playing';elapsed=0;events=[];abnormalAt=null;lastEmit=null}
  if(a==='pause'){if(state==='paused'&&condition==='incomplete')return;state=state==='paused'?'playing':'paused';abnormalAt=null;lastEmit=null}
  if(a==='end'){state='result';abnormalAt=null;lastEmit=null}
  if(a==='again'){state='ready';elapsed=0;events=[];abnormalAt=null;lastEmit=null;condition='inside';panel.querySelector('select').value='inside'}
  render();
 }
 function setupCanvas(){
  const canvas=app.querySelector('canvas');if(!canvas)return;const rect=canvas.getBoundingClientRect();canvas.width=Math.round(rect.width*devicePixelRatio);canvas.height=Math.round(rect.height*devicePixelRatio);
  const draw=()=>{const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);if(!points.length)return;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h));if(points.length>2)ctx.closePath();ctx.strokeStyle=getComputedStyle(app).getPropertyValue('--accent');ctx.lineWidth=2*devicePixelRatio;ctx.fillStyle='#71e1bb0a';ctx.fill();ctx.stroke();if(state==='ready'&&mode==='rectangle')points.forEach(([x,y])=>{ctx.fillStyle='#fff';ctx.fillRect(x*w-4*devicePixelRatio,y*h-4*devicePixelRatio,8*devicePixelRatio,8*devicePixelRatio)})};draw();
  if(state!=='ready')return;
  let corner=-1;
  const p=e=>{const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};
  canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drawing=true;anchor=p(e);corner=mode==='rectangle'?points.findIndex(([x,y])=>Math.hypot((x-anchor[0])*rect.width,(y-anchor[1])*rect.height)<24):-1;if(corner>=0){anchor=points[(corner+2)%4]}else points=[anchor];draw()};
  canvas.onpointermove=e=>{if(!drawing)return;const v=p(e);if(mode==='gesture')points.push(v);else points=[[Math.min(anchor[0],v[0]),Math.min(anchor[1],v[1])],[Math.max(anchor[0],v[0]),Math.min(anchor[1],v[1])],[Math.max(anchor[0],v[0]),Math.max(anchor[1],v[1])],[Math.min(anchor[0],v[0]),Math.max(anchor[1],v[1])]];draw()};
  canvas.onpointerup=()=>{drawing=false;if(points.length<3)points=[];render()};canvas.onpointercancel=()=>{drawing=false;render()};
 }
 panel.querySelector('select').onchange=e=>{condition=e.target.value;if(state==='playing'){if(condition==='incomplete')state='paused';if(condition==='inside'||condition==='incomplete'){abnormalAt=null;lastEmit=null}else abnormalAt??=elapsed}render()};
 // 演示计时与每个预览屏独立，暂停期间不累加。
 setInterval(()=>{if(state!=='playing')return;elapsed++;if(elapsed>=minutes*60){state='result';abnormalAt=null;lastEmit=null}else if(condition==='outside'||condition==='absent'){abnormalAt??=elapsed;if(elapsed-abnormalAt>=delay&&(lastEmit===null||elapsed-lastEmit>=repeat)){events.push({time:elapsed,reason:condition==='outside'?'人体越界':'画面中无人'});lastEmit=elapsed}}render()},1000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){state='paused';abnormalAt=null;lastEmit=null;render()}});
 new ResizeObserver(setupCanvas).observe(app);render();
}
['ready','settings','playing','result'].forEach(mount);
</script>
</body>
</html>
