name: safety_margin
description: "单人人体骨骼区域游戏"
publish_to: none
version: 0.3.3+9

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: 0.12.1
  # 显式使用 Camera2，确保 Android 图像流提供 ML Kit 所需的 NV21。
  camera_android: 0.10.11+1
  google_mlkit_pose_detection: 0.16.1
  shared_preferences: 2.5.5
  wakelock_plus: ^1.4.0
  flutter_reactive_ble: ^5.5.0
  permission_handler: 13.0.2
  device_info_plus: ^13.2.0
  audioplayers: ^6.1.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# permission_handler_android 14.1.0 引用了本机 Android SDK 还没有的
# Manifest.permission.ACCESS_LOCAL_NETWORK 常量，编译报"找不到符号"；
# 锁定到仍兼容当前 SDK 的版本，等本机 SDK/该插件都稳定后再解开。
dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
